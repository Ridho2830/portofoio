<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f1;
  --panel:#1c1c1e;
  --border:rgba(255,255,255,0.08);
  --muted:#888;
  --acc:#2563eb;
  --paper:#ffffff;
  --ink:#111;
  --ink2:#444;
  --ink3:#777;
  --rule:#e8e8e8;
}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

.topbar{background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:54px;position:sticky;top:0;z-index:200;}
.logo{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.3px}
.logo em{font-style:normal;color:var(--acc)}
.topbar-actions{display:flex;gap:10px;align-items:center}
.btn{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;padding:8px 18px;border:none;border-radius:7px;cursor:pointer;transition:all .15s;}
.btn-ghost{background:rgba(255,255,255,.07);color:#ccc}
.btn-ghost:hover{background:rgba(255,255,255,.13);color:#fff}
.btn-blue{background:var(--acc);color:#fff}
.btn-blue:hover{background:#1d4ed8;transform:translateY(-1px)}

.workspace{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 54px)}

.panel{background:var(--panel);overflow-y:auto;max-height:calc(100vh - 54px);position:sticky;top:54px;border-right:1px solid rgba(255,255,255,.04);}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.tabs{display:flex;overflow-x:auto;background:#161616;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.05)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--muted);font-family:'Sora',sans-serif;font-size:11px;font-weight:600;padding:13px 13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.6px;transition:all .15s;}
.tab.active{color:#fff;border-bottom-color:var(--acc)}
.tab:hover:not(.active){color:#bbb}

.pane{display:none;padding:20px}
.pane.active{display:block}
.pane-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:16px}
.fg{margin-bottom:13px}
label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.3);margin-bottom:5px}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:9px 12px;color:#e8e8e8;font-family:'Sora',sans-serif;font-size:13px;outline:none;transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:74px;line-height:1.5}
select option{background:#1c1c1e}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:14px;margin-bottom:10px;}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--acc)}
.btn-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:2px 5px;border-radius:4px;transition:all .15s}
.btn-x:hover{color:#f87171;background:rgba(248,113,113,.1)}
.btn-add{width:100%;background:rgba(37,99,235,.1);border:1px dashed rgba(37,99,235,.3);color:rgba(37,99,235,.8);font-family:'Sora',sans-serif;font-size:12px;font-weight:600;padding:9px;border-radius:7px;cursor:pointer;margin-top:4px;transition:all .15s;}
.btn-add:hover{background:rgba(37,99,235,.18);color:var(--acc)}

.swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.swatch.on{border-color:#fff;transform:scale(1.15)}

.preview{background:#e2e0dc;padding:36px 28px;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto}

/* ===== CV ===== */
#cvpage{
  width:794px;background:#fff;min-height:1123px;
  box-shadow:0 8px 60px rgba(0,0,0,.18);
  font-family:'Sora',sans-serif;color:#111;
  position:relative;
}
.cv-topbar{height:5px;background:var(--acc)}
.cv-header{padding:40px 52px 28px;border-bottom:1px solid #ebebeb}
.cv-name{font-family:'Lora',serif;font-size:34px;font-weight:600;letter-spacing:-.5px;line-height:1.1;color:#111}
.cv-role{font-size:13px;font-weight:500;color:var(--acc);margin-top:6px;letter-spacing:.3px}
.cv-contacts{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:14px}
.cc{font-size:11.5px;color:#666;display:flex;align-items:center;gap:5px}
.cc svg{opacity:.45;flex-shrink:0}

.cv-body{display:grid;grid-template-columns:1fr 190px;min-height:900px}
.cv-main{padding:28px 36px 36px 52px;border-right:1px solid #ebebeb}
.cv-aside{padding:28px 24px 36px 26px;background:#fafafa}

.cv-section{margin-bottom:26px}
.cv-sec-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.cv-sec-title::after{content:'';flex:1;height:1px;background:#ebebeb}
.cv-summary-text{font-size:12.5px;line-height:1.75;color:#444;text-align:justify}

.cv-entry{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f2f2f2}
.cv-entry:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cv-entry-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cv-entry-title{font-size:13.5px;font-weight:600;color:#111}
.cv-entry-date{font-size:11px;color:#888;white-space:nowrap;flex-shrink:0}
.cv-entry-sub{font-size:11.5px;color:#888;margin:2px 0 5px;font-family:'Lora',serif;font-style:italic}
.cv-entry-desc{font-size:12px;color:#555;line-height:1.65;text-align:justify}

.cv-aside-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--acc);margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid #ebebeb}
.cv-aside-sec{margin-bottom:22px}

.cv-skill{margin-bottom:9px}
.cv-skill-name{font-size:11.5px;font-weight:500;color:#444;margin-bottom:4px}
.cv-skill-track{height:3px;background:#e4e4e4;border-radius:2px;overflow:hidden}
.cv-skill-fill{height:100%;border-radius:2px;background:var(--acc)}
.cv-skill-pill{display:inline-block;font-size:11px;font-weight:500;background:#eff4ff;color:var(--acc);padding:3px 9px;border-radius:20px;margin:0 3px 5px 0}

.cv-lang-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-bottom:8px}
.cv-lang-name{color:#444}
.cv-lang-dots{display:flex;gap:3px}
.cv-dot{width:7px;height:7px;border-radius:50%;background:#e0e0e0}
.cv-dot.on{background:var(--acc)}

@media(max-width:880px){
  .workspace{grid-template-columns:1fr}
  .panel{position:static;max-height:none}
  .preview{padding:16px}
  #cvpage{width:100%;min-width:0}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">cv<em>.</em>builder</div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" onclick="if(confirm('Reset semua data?'))location.reload()">↺ Reset</button>
    <button class="btn btn-blue" id="xbtn" onclick="exportPDF()">⬇ Export PDF</button>
  </div>
</div>

<div class="workspace">
  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="profil">Profil</button>
      <button class="tab" data-tab="exp">Pengalaman</button>
      <button class="tab" data-tab="edu">Pendidikan</button>
      <button class="tab" data-tab="skill">Keahlian</button>
      <button class="tab" data-tab="lang">Bahasa</button>
      <button class="tab" data-tab="tema">Tema</button>
    </div>

    <div class="pane active" id="pane-profil">
      <div class="pane-title">Informasi Pribadi</div>
      <div class="row2">
        <div class="fg"><label>Nama Depan</label><input id="fn" placeholder="Budi" oninput="render()"></div>
        <div class="fg"><label>Nama Belakang</label><input id="ln" placeholder="Santoso" oninput="render()"></div>
      </div>
      <div class="fg"><label>Jabatan / Profesi</label><input id="role" placeholder="Full Stack Developer" oninput="render()"></div>
      <div class="fg"><label>Ringkasan Profil</label><textarea id="summary" placeholder="Ceritakan tentang diri kamu..." oninput="render()"></textarea></div>
      <div class="fg"><label>Email</label><input id="email" placeholder="budi@email.com" oninput="render()"></div>
      <div class="fg"><label>Telepon</label><input id="phone" placeholder="+62 812 3456 7890" oninput="render()"></div>
      <div class="fg"><label>Lokasi</label><input id="loc" placeholder="Jakarta, Indonesia" oninput="render()"></div>
      <div class="fg"><label>LinkedIn / Website</label><input id="link" placeholder="linkedin.com/in/username" oninput="render()"></div>
    </div>

    <div class="pane" id="pane-exp">
      <div class="pane-title">Pengalaman Kerja</div>
      <div id="exp-list"></div>
      <button class="btn-add" onclick="addExp()">+ Tambah Pengalaman</button>
    </div>

    <div class="pane" id="pane-edu">
      <div class="pane-title">Pendidikan</div>
      <div id="edu-list"></div>
      <button class="btn-add" onclick="addEdu()">+ Tambah Pendidikan</button>
    </div>

    <div class="pane" id="pane-skill">
      <div class="pane-title">Keahlian</div>
      <div class="fg"><label>Tampilan Skill</label>
        <select id="sstyle" onchange="render()">
          <option value="bar">Bar Progress</option>
          <option value="pill">Pill / Tag</option>
        </select>
      </div>
      <div id="skill-list"></div>
      <button class="btn-add" onclick="addSkill()">+ Tambah Keahlian</button>
    </div>

    <div class="pane" id="pane-lang">
      <div class="pane-title">Bahasa</div>
      <div id="lang-list"></div>
      <button class="btn-add" onclick="addLang()">+ Tambah Bahasa</button>
    </div>

    <div class="pane" id="pane-tema">
      <div class="pane-title">Warna Aksen</div>
      <div class="fg"><label>Pilih Preset</label><div class="swatch-row" id="swatches"></div></div>
      <div class="fg"><label>Warna Custom</label><input type="color" id="ccolor" value="#2563eb" oninput="setColor(this.value)"></div>
    </div>
  </div>

  <div class="preview">
    <div id="cvpage">
      <div class="cv-topbar" id="cv-topbar"></div>
      <div class="cv-header">
        <div class="cv-name" id="cv-name">Budi Santoso</div>
        <div class="cv-role" id="cv-role">Full Stack Developer</div>
        <div class="cv-contacts" id="cv-contacts"></div>
      </div>
      <div class="cv-body">
        <div class="cv-main">
          <div class="cv-section" id="cv-sum-sec">
            <div class="cv-sec-title">Tentang Saya</div>
            <div class="cv-summary-text" id="cv-sum"></div>
          </div>
          <div class="cv-section" id="cv-exp-sec" style="display:none">
            <div class="cv-sec-title">Pengalaman Kerja</div>
            <div id="cv-exp-out"></div>
          </div>
          <div class="cv-section" id="cv-edu-sec" style="display:none">
            <div class="cv-sec-title">Pendidikan</div>
            <div id="cv-edu-out"></div>
          </div>
        </div>
        <div class="cv-aside">
          <div class="cv-aside-sec" id="cv-skill-sec" style="display:none">
            <div class="cv-aside-title">Keahlian</div>
            <div id="cv-skill-out"></div>
          </div>
          <div class="cv-aside-sec" id="cv-lang-sec" style="display:none">
            <div class="cv-aside-title">Bahasa</div>
            <div id="cv-lang-out"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let acc='#2563eb',exps=[],edus=[],skills=[],langs=[];
let _id=1;const uid=()=>_id++;
const COLORS=['#2563eb','#0f766e','#7c3aed','#be123c','#b45309','#0369a1','#16a34a','#374151','#6b7280'];

// tabs
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('pane-'+b.dataset.tab).classList.add('active');
}));

// swatches
const sg=document.getElementById('swatches');
COLORS.forEach(c=>{
  const d=document.createElement('div');
  d.className='swatch'+(c===acc?' on':'');
  d.dataset.c=c;d.style.background=c;
  d.onclick=()=>{setColor(c);document.getElementById('ccolor').value=c};
  sg.appendChild(d);
});

function setColor(c){
  acc=c;
  document.documentElement.style.setProperty('--acc',c);
  document.getElementById('cv-topbar').style.background=c;
  document.querySelectorAll('.cv-sec-title,.cv-aside-title,.cv-role').forEach(e=>e.style.color=c);
  document.querySelectorAll('.cv-skill-fill').forEach(e=>e.style.background=c);
  document.querySelectorAll('.cv-skill-pill').forEach(e=>{e.style.color=c;e.style.background=hexA(c,.08)});
  document.querySelectorAll('.cv-dot.on').forEach(e=>e.style.background=c);
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.c===c));
}
function hexA(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}

// entries
function addExp(d={}){
  const id=uid();exps.push({id,...d});
  const el=document.createElement('div');el.className='card';el.id='c'+id;
  el.innerHTML=`<div class="card-head"><span class="card-label">Pengalaman</span><button class="btn-x" onclick="rm('exp',${id})">×</button></div>
    <div class="fg"><label>Posisi</label><input value="${d.title||''}" oninput="upd('exp',${id},'title',this.value)" placeholder="Software Engineer"></div>
    <div class="fg"><label>Perusahaan</label><input value="${d.company||''}" oninput="upd('exp',${id},'company',this.value)" placeholder="PT. Contoh"></div>
    <div class="fg"><label>Periode</label><input value="${d.date||''}" oninput="upd('exp',${id},'date',this.value)" placeholder="Jan 2022 – Sekarang"></div>
    <div class="fg"><label>Deskripsi</label><textarea oninput="upd('exp',${id},'desc',this.value)" placeholder="Tanggung jawab dan pencapaian...">${d.desc||''}</textarea></div>`;
  document.getElementById('exp-list').appendChild(el);render();
}
function addEdu(d={}){
  const id=uid();edus.push({id,...d});
  const el=document.createElement('div');el.className='card';el.id='c'+id;
  el.innerHTML=`<div class="card-head"><span class="card-label">Pendidikan</span><button class="btn-x" onclick="rm('edu',${id})">×</button></div>
    <div class="fg"><label>Program Studi / Gelar</label><input value="${d.title||''}" oninput="upd('edu',${id},'title',this.value)" placeholder="S1 Teknik Informatika"></div>
    <div class="fg"><label>Institusi</label><input value="${d.company||''}" oninput="upd('edu',${id},'company',this.value)" placeholder="Universitas Indonesia"></div>
    <div class="fg"><label>Tahun</label><input value="${d.date||''}" oninput="upd('edu',${id},'date',this.value)" placeholder="2018 – 2022"></div>
    <div class="fg"><label>Keterangan</label><input value="${d.desc||''}" oninput="upd('edu',${id},'desc',this.value)" placeholder="IPK 3.8 · Cum Laude"></div>`;
  document.getElementById('edu-list').appendChild(el);render();
}
function addSkill(d={}){
  const id=uid();skills.push({id,...d});
  const el=document.createElement('div');el.className='card';el.id='c'+id;
  el.innerHTML=`<div class="card-head"><span class="card-label">Skill</span><button class="btn-x" onclick="rm('skill',${id})">×</button></div>
    <div class="row2">
      <div class="fg"><label>Nama</label><input value="${d.name||''}" oninput="upd('skill',${id},'name',this.value)" placeholder="React.js"></div>
      <div class="fg"><label>Level 0–100</label><input type="number" min="0" max="100" value="${d.level??80}" oninput="upd('skill',${id},'level',+this.value)"></div>
    </div>`;
  document.getElementById('skill-list').appendChild(el);render();
}
function addLang(d={}){
  const id=uid();langs.push({id,...d});
  const el=document.createElement('div');el.className='card';el.id='c'+id;
  el.innerHTML=`<div class="card-head"><span class="card-label">Bahasa</span><button class="btn-x" onclick="rm('lang',${id})">×</button></div>
    <div class="row2">
      <div class="fg"><label>Bahasa</label><input value="${d.name||''}" oninput="upd('lang',${id},'name',this.value)" placeholder="English"></div>
      <div class="fg"><label>Level 1–5</label><input type="number" min="1" max="5" value="${d.level??3}" oninput="upd('lang',${id},'level',+this.value)"></div>
    </div>`;
  document.getElementById('lang-list').appendChild(el);render();
}
function upd(type,id,key,val){
  const a=type==='exp'?exps:type==='edu'?edus:type==='skill'?skills:langs;
  const e=a.find(x=>x.id===id);if(e)e[key]=val;render();
}
function rm(type,id){
  if(type==='exp')exps=exps.filter(x=>x.id!==id);
  else if(type==='edu')edus=edus.filter(x=>x.id!==id);
  else if(type==='skill')skills=skills.filter(x=>x.id!==id);
  else langs=langs.filter(x=>x.id!==id);
  document.getElementById('c'+id).remove();render();
}

// SVG icons
const IC={
  mail:`<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>`,
  phone:`<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .84h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>`,
  pin:`<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/>`,
  link:`<path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>`
};
const svg=p=>`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

function render(){
  const fn=document.getElementById('fn').value;
  const ln=document.getElementById('ln').value;
  const role=document.getElementById('role').value;
  const sum=document.getElementById('summary').value;
  const em=document.getElementById('email').value;
  const ph=document.getElementById('phone').value;
  const lo=document.getElementById('loc').value;
  const lk=document.getElementById('link').value;
  const ss=document.getElementById('sstyle').value;

  document.getElementById('cv-name').textContent=(fn+' '+ln).trim()||'Nama Kamu';
  const roleEl=document.getElementById('cv-role');roleEl.textContent=role||'Jabatan / Profesi';roleEl.style.color=acc;

  // contacts
  let ch='';
  if(em)ch+=`<span class="cc">${svg(IC.mail)} ${em}</span>`;
  if(ph)ch+=`<span class="cc">${svg(IC.phone)} ${ph}</span>`;
  if(lo)ch+=`<span class="cc">${svg(IC.pin)} ${lo}</span>`;
  if(lk)ch+=`<span class="cc">${svg(IC.link)} ${lk}</span>`;
  document.getElementById('cv-contacts').innerHTML=ch;

  // summary
  const ss2=document.getElementById('cv-sum-sec');
  if(sum){ss2.style.display='block';document.getElementById('cv-sum').textContent=sum;}
  else ss2.style.display='none';

  // exp
  const esec=document.getElementById('cv-exp-sec');
  if(exps.length){
    esec.style.display='block';
    document.getElementById('cv-exp-out').innerHTML=exps.map(e=>`
      <div class="cv-entry">
        <div class="cv-entry-row"><span class="cv-entry-title">${e.title||''}</span><span class="cv-entry-date">${e.date||''}</span></div>
        <div class="cv-entry-sub">${e.company||''}</div>
        <div class="cv-entry-desc">${(e.desc||'').replace(/\n/g,'<br>')}</div>
      </div>`).join('');
  }else esec.style.display='none';

  // edu
  const edsec=document.getElementById('cv-edu-sec');
  if(edus.length){
    edsec.style.display='block';
    document.getElementById('cv-edu-out').innerHTML=edus.map(e=>`
      <div class="cv-entry">
        <div class="cv-entry-row"><span class="cv-entry-title">${e.title||''}</span><span class="cv-entry-date">${e.date||''}</span></div>
        <div class="cv-entry-sub">${e.company||''}</div>
        <div class="cv-entry-desc">${e.desc||''}</div>
      </div>`).join('');
  }else edsec.style.display='none';

  // skills
  const sksec=document.getElementById('cv-skill-sec');
  if(skills.length){
    sksec.style.display='block';
    document.getElementById('cv-skill-out').innerHTML = ss==='bar'
      ? skills.map(s=>`<div class="cv-skill"><div class="cv-skill-name">${s.name||''}</div><div class="cv-skill-track"><div class="cv-skill-fill" style="width:${s.level??0}%;background:${acc}"></div></div></div>`).join('')
      : skills.map(s=>`<span class="cv-skill-pill" style="color:${acc};background:${hexA(acc,.08)}">${s.name||''}</span>`).join('');
  }else sksec.style.display='none';

  // langs
  const lsec=document.getElementById('cv-lang-sec');
  if(langs.length){
    lsec.style.display='block';
    document.getElementById('cv-lang-out').innerHTML=langs.map(l=>{
      const dots=[1,2,3,4,5].map(i=>`<div class="cv-dot${i<=(l.level||0)?' on':''}" style="${i<=(l.level||0)?'background:'+acc:''}"></div>`).join('');
      return`<div class="cv-lang-row"><span class="cv-lang-name">${l.name||''}</span><div class="cv-lang-dots">${dots}</div></div>`;
    }).join('');
  }else lsec.style.display='none';

  // reapply accent
  document.querySelectorAll('.cv-sec-title,.cv-aside-title').forEach(e=>e.style.color=acc);
  document.getElementById('cv-topbar').style.background=acc;
}

function exportPDF(){
  const btn=document.getElementById('xbtn');
  btn.textContent='⏳ Proses...';btn.disabled=true;
  const fn=document.getElementById('fn').value||'CV';
  const ln=document.getElementById('ln').value||'';
  html2pdf().set({
    margin:0,filename:`CV_${fn}_${ln}.pdf`.replace(/\s+/g,'_'),
    image:{type:'jpeg',quality:.98},
    html2canvas:{scale:2,useCORS:true,logging:false},
    jsPDF:{unit:'px',format:[794,1123],orientation:'portrait'}
  }).from(document.getElementById('cvpage')).save()
    .then(()=>{btn.textContent='⬇ Export PDF';btn.disabled=false});
}
